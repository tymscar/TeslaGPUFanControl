[package]
name    = "tesla_fan_control"
version = "0.1.0"
edition = "2021"

[dependencies]
nvml-wrapper      = "0.12"
nix               = { version = "0.29", features = ["ioctl", "fs"] }
clap              = { version = "4", features = ["derive"] }
tracing           = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald  = "0.3"
signal-hook       = "0.3"
rust-ini          = "0.21"
thiserror         = "1"
anyhow            = "1"

[dev-dependencies]
tempfile          = "3"

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[lints.clippy]
unwrap_used      = "deny"
expect_used      = "warn"
indexing_slicing = "warn"
panic            = "warn"
