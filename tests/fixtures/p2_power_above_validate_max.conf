# Fixture: gpu:0 has power_limit_w 25000 (typo: forgot units, that's mW)
# while power_limit_validate_max_w defaults to 1000 → P2.
[global]
config_version   = 1
poll_interval_ms = 1000
log_level        = info
log_file         =

[watchdog]
enabled            = true
device             = /dev/watchdog
timeout_s          = 30
gpu_fail_threshold = 3

[gpu:0]
nvml_index          = 0
curve               = 40:20, 55:40, 70:80, 80:100
min_fan_pct         = 20
max_fan_pct         = 100
power_limit_enabled = true
power_limit_w       = 25000

[fan:f0]
chip               = nct6798
pwm_channel        = 1
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

[group:main]
gpus = 0
fans = f0
