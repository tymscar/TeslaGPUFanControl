# Fixture: config_version = 99 (this daemon recognises 1) → W7.
[global]
config_version   = 99
poll_interval_ms = 1000
log_level        = info
log_file         =

[watchdog]
enabled            = true
device             = /dev/watchdog
timeout_s          = 30
gpu_fail_threshold = 3

[gpu:0]
nvml_index   = 0
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

[gpu:1]
nvml_index   = 1
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

[gpu:2]
nvml_index   = 2
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

[fan:f0]
chip               = nct6798
pwm_channel        = 1
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

[fan:f1]
chip               = nct6798
pwm_channel        = 2
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

[group:main]
gpus = 0
fans = f0

[group:shared]
gpus = 1, 2
fans = f1
