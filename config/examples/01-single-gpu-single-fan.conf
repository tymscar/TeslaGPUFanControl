# Example 1 — Single GPU, single fan, single cooling group.
#
# Smallest valid topology:
#   • one Tesla card (NVML index 0)
#   • one PWM header on the SuperIO chip driving its dedicated duct fan
#   • one [group:*] tying them together
#
# Use this as the starting point for a workstation with one passively-cooled
# accelerator in a dedicated airflow shroud. Validate before installing:
#
#   tesla_fan_control --check-config -c config/examples/01-single-gpu-single-fan.conf
#
# See docs/CONFIG-TUTORIAL.md for how to discover the values below
# (nvml_index, chip, pwm_channel) on your own hardware.
#
# If your PSU cannot sustain the GPU at full board power, see
# config/examples/03-with-power-limit.conf for the Power Limit feature
# (ADR-0008). All Power Limit keys default to disabled, so this example
# leaves the card at firmware default.

[global]
config_version   = 1
poll_interval_ms = 1000
log_level        = info
log_file         =                              # empty = journald only

[watchdog]
enabled            = true
device             = /dev/watchdog
timeout_s          = 30
gpu_fail_threshold = 3

# --- GPU ---
[gpu:0]
nvml_index   = 0
# P100 / P40 throttle at 85 °C — 100 % lands at 80 °C as preventive headroom.
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

# --- Fan ---
[fan:f0]
chip               = nct6798                    # from /sys/class/hwmon/*/name
pwm_channel        = 1                          # maps to pwm1 / fan1_input
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

# --- Cooling group ---
[group:main]
gpus = 0
fans = f0
