# Example 2 — Two cooling groups, mixed topology.
#
# Models a 3-GPU rig where airflow is asymmetric:
#
#   group:main    1 GPU  + 1 fan       — GPU 0 has its own dedicated duct
#   group:shared  2 GPUs + 1 fan       — GPUs 1 + 2 share a Y-duct off one fan
#
# Per ADR-0006 / config validation S4 + S5: every GPU and every fan must be
# referenced by exactly one group. That is why GPU 0 lives alone in its group
# even though it could in principle be left ungrouped — the validator refuses
# to start with orphans.
#
# Group dynamics: for each [group:*], every GPU's curve is evaluated at its
# current temperature, clamped to [min_fan_pct, max_fan_pct], and the group's
# target % is the max() of those values applied uniformly to every fan in the
# group. In group:shared, whichever of GPU 1 / GPU 2 is hotter sets the speed
# of fan f1.
#
# Validate before installing:
#
#   tesla_fan_control --check-config -c config/examples/02-two-groups-shared-duct.conf
#
# This example focuses on cooling-group topology. For PSU-protection setups
# (most multi-GPU rigs) layer in the Power Limit feature shown in
# config/examples/03-with-power-limit.conf — it composes cleanly with any
# group topology.

[global]
config_version   = 1
poll_interval_ms = 1000
log_level        = info
log_file         =                              # empty = journald only

[watchdog]
enabled            = true
device             = /dev/watchdog
timeout_s          = 30
gpu_fail_threshold = 3

# --- GPUs ---
# Identical curves across all three cards in this example. In practice you can
# bias each card individually — e.g. raise min_fan_pct on the GPU furthest
# from the fan, or steepen the curve on a card under heavier load.

[gpu:0]
nvml_index   = 0
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

[gpu:1]
nvml_index   = 1
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

[gpu:2]
nvml_index   = 2
curve        = 40:20, 55:40, 70:80, 80:100
min_fan_pct  = 20
max_fan_pct  = 100

# --- Fans ---
# (chip, device_path, pwm_channel) tuple must be unique per S9. Different
# pwm_channel values on the same chip are fine.

[fan:f0]
chip               = nct6798
pwm_channel        = 1                          # GPU 0 dedicated duct
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

[fan:f1]
chip               = nct6798
pwm_channel        = 2                          # Y-duct feeding GPUs 1 + 2
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

# --- Cooling groups ---
[group:main]
gpus = 0
fans = f0

[group:shared]
gpus = 1, 2
fans = f1
