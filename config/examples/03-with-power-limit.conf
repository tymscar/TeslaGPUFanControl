# Example 3 — Two GPUs with Power Limit enforcement (ADR-0008).
#
# Use this when your PSU cannot sustain all GPUs at full board power
# simultaneously. The daemon enforces a configured power-management limit
# at startup and re-asserts it on a fixed cadence; external overrides
# (`nvidia-smi -pl`, driver reloads) are reverted within one cycle.
#
# Worked PSU budget (matches docs/CONFIG-TUTORIAL.md §5):
#   • 2× NVIDIA H100 PCIe (TDP 350 W each)
#   • Single-socket CPU (~50 W sustained), modest drives/fans (~50 W)
#   • 750 W Gold PSU; sustained budget ≈ 750 × 0.85 = 638 W
#   • GPU budget = 638 − 100 = 538 W
#   • Cap each GPU at 260 W → 520 W total → fits the budget.
#
# Validate before installing:
#   tesla_fan_control --check-config -c config/examples/03-with-power-limit.conf
#
# Static rules P1–P5 catch typos at this stage; driver-side constraints
# (each GPU's power.min_limit / power.max_limit from `nvidia-smi --query-gpu`)
# are checked at runtime (R6) when the daemon starts.

[global]
config_version                  = 1
poll_interval_ms                = 1000
log_level                       = info
log_file                        =                  # empty = journald only

# Power Limit knobs (ADR-0008). Defaults shown for clarity — only the
# `*_enabled` flag on the [gpu:*] block actually turns the feature on.
power_limit_check_interval_s    = 120              # re-assert every 2 minutes
power_limit_restore_on_shutdown = false            # ADR-0009 — preserves
                                                   # PSU protection across
                                                   # daemon-down windows.
power_limit_validate_max_w      = 1000             # bump if your hardware
                                                   # legitimately exceeds 1 kW.

[watchdog]
enabled            = true
device             = /dev/watchdog
timeout_s          = 30
# Counts apply to both temp reads AND power-limit reads/sets (ADR-0008).
gpu_fail_threshold = 3

# --- GPUs ---
[gpu:0]
nvml_index          = 0
curve               = 40:30, 55:50, 70:80, 80:100  # H100 — keep noise under control until thermal pressure
min_fan_pct         = 25
max_fan_pct         = 100
power_limit_enabled = true
power_limit_w       = 260                          # H100 PCIe stock TDP 350 W; capped for PSU

[gpu:1]
nvml_index          = 1
curve               = 40:30, 55:50, 70:80, 80:100
min_fan_pct         = 25
max_fan_pct         = 100
power_limit_enabled = true
power_limit_w       = 260

# --- Fans ---
[fan:f0]
chip               = nct6798
pwm_channel        = 1
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

[fan:f1]
chip               = nct6798
pwm_channel        = 2
min_rpm            = 200
max_rpm            = 3000
fan_fail_threshold = 3
spin_up_grace_s    = 10

# --- Cooling groups (one duct per GPU) ---
[group:gpu0]
gpus = 0
fans = f0

[group:gpu1]
gpus = 1
fans = f1
